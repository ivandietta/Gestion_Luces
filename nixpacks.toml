[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x"]

[phases.install]
cmds = [
  "echo '=== Installing backend dependencies ==='",
  "cd backend && npm ci --omit=dev"
]

[phases.build]
cmds = ["echo '=== No build step required for backend ==='"]

[start]
cmd = "cd backend && node server.js"

[variables]
NODE_ENV = "production"

